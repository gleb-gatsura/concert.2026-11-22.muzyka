<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Концерт 22.11.2026 — музыка</title>
<style>
  :root {
    --bg: #12101a;
    --card: #1d1930;
    --accent: #c96a5a;
    --accent2: #e8a87c;
    --text: #efe9e0;
    --muted: #9a8fa8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse at top, #241d3a 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid #322a4d;
    border-radius: 24px;
    max-width: 460px;
    width: 100%;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    text-align: center;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent2);
    border: 1px solid #4a3f5f;
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 18px;
  }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .cover {
    width: 120px; height: 120px;
    border-radius: 18px;
    margin: 0 auto 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 46px;
  }
  .track-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .artist { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  audio { width: 100%; margin-bottom: 20px; }
  p.note { color: var(--muted); font-size: 12px; line-height: 1.5; }
  footer { margin-top: 20px; color: var(--muted); font-size: 11px; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">Концерт · 22.11.2026</div>
    <h1>Тамара Кароль</h1>
    <div class="sub">Композитор, концертмейстер, автор песен</div>
    <div class="cover">🎵</div>
    <div class="track-name">Фрагмент творчества</div>
    <div class="artist">Тамара Кароль</div>
    <audio id="player" controls preload="auto" src="track.mp3"></audio>
    <p class="note">Полная программа — на концерте 22 ноября 2026 в 17:00,<br>ЦКС Филимонковское.</p>
    <footer>Плеер начнёт играть автоматически</footer>
    <p class="hint" id="hint" style="display:none">Если звук не включился, нажмите на страницу или на кнопку ▶</p>
  </div>
  <script>
    (function(){
      var player = document.getElementById('player');
      var hint = document.getElementById('hint');
      function tryPlay(){
        var p = player.play();
        if (p && p.catch) {
          p.catch(function(){
            player.muted = true;
            var p2 = player.play();
            if (p2 && p2.catch) p2.catch(function(){});
            hint.style.display = 'block';
          });
        }
      }
      tryPlay();
      document.addEventListener('click', function(){
        player.muted = false;
        player.volume = 1;
        tryPlay();
      }, { once: true });
      player.addEventListener('canplay', tryPlay);
    })();
  </script>
</body>
</html>
